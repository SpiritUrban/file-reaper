[package]
name = "trashradar-bench-rerun"
description = "Бенчмарк-гейт повторного запуску: SQLite-відновлення + USN-дельта + перерахунок → актуальна цифра < 2 с (T-154, architecture.md §15)."
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[[bin]]
name = "rerun-bench"
path = "src/main.rs"

[dependencies]
trashradar-domain = { path = "../../core/domain" }
trashradar-app = { path = "../../core/app" }
trashradar-index-memory = { path = "../../core/infra/index-memory" }
trashradar-index-sqlite = { path = "../../core/infra/index-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
