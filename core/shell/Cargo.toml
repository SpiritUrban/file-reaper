[package]
name = "trashradar-shell"
description = "Tauri-оболонка: вікно, IPC-міст, життєвий цикл. Бізнес-логіки — нуль."
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# time: затримки/таймаути в async-командах. Tokio вже в дереві через Tauri.
tokio = { version = "1", features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trashradar-domain = { path = "../domain" }
trashradar-app = { path = "../app" }

[dev-dependencies]
# Mock-рантайм Tauri: наскрізні тести диспетчеризації команд без вікна.
tauri = { version = "2", features = ["test"] }
