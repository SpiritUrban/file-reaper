name: Installer

# Повна збірка NSIS-інсталятора артефактом (DoD T-002).
# Запускається на push у main і вручну; не входить у PR-checks,
# щоб не подвоювати найдовший джоб на кожен пуш гілки.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  nsis:
    name: Installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci
        working-directory: ui
      # Tauri CLI — з devDependencies ui (та сама версія, що локально).
      # beforeBuildCommand з tauri.conf.json збере фронтенд сам.
      - run: ..\..\ui\node_modules\.bin\tauri.cmd build
        shell: cmd
        working-directory: core/shell
      - uses: actions/upload-artifact@v4
        with:
          name: trashradar-nsis-installer
          path: core/target/release/bundle/nsis/*.exe
          if-no-files-found: error
