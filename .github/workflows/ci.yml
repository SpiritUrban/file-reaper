name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: UI (typecheck + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    name: Core (fmt + clippy + check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      # shell тягне повний Tauri — він у власному джобі нижче,
      # щоб швидкі перевірки шарів не чекали на нього.
      - run: cargo check --workspace --exclude trashradar-shell
      - run: cargo clippy --workspace --exclude trashradar-shell -- -D warnings
      - run: cargo test --workspace --exclude trashradar-shell

  shell:
    name: Core shell (tauri check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo check -p trashradar-shell
      - run: cargo clippy -p trashradar-shell -- -D warnings

  bench:
    name: Bench (index + scan regression gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            benches/index-bench
            benches/scan-bench

      # T-019: in-memory index — memory hard-gate >15%; timings WARN + ceiling
      - name: index-bench (T-019)
        working-directory: benches/index-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-035: scan→index fill @ 1.5M synthetic — §15 ceiling 10s; memory hard-gate
      - name: scan-bench (T-035)
        working-directory: benches/scan-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release
