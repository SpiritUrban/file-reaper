name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: UI (typecheck + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    name: Core (fmt + clippy + check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          # Правило 5: свій ключ кешу на джобу.
          key: core-windows
      - run: cargo fmt --all --check
      # shell тягне повний Tauri — він у власному джобі нижче,
      # щоб швидкі перевірки шарів не чекали на нього.
      - run: cargo check --workspace --exclude trashradar-shell
      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude trashradar-shell --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: Surface clippy output
        if: failure() && steps.clippy.conclusion == 'failure'
        shell: bash
        run: bash ../scripts/ci-annotate.sh "Clippy output (windows)" clippy.log
      - name: Tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude trashradar-shell 2>&1 | tee cargo-test.log
      - name: Surface cargo test output
        if: failure() && steps.tests.conclusion == 'failure'
        shell: bash
        run: bash ../scripts/ci-annotate.sh "cargo test output (windows)" cargo-test.log

  # Правило 7a: «тести зелені локально» не означає нічого про CI — локально
  # інша ОС, і помітити різницю нічим. Правило 6a: платформно-нейтральний код
  # із платформним припущенням у рантаймі компілюється всюди й проходить
  # clippy на будь-якій платформі, а працює лише на одній. Ця джоба — перше
  # і єдине місце, де таке видно, і зробити її зеленою треба ДО першого тега,
  # а не разом із ним.
  core-linux:
    name: Core on Linux (правила 6a/7a)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core-linux
      # Форматування перевіряється і тут: .gitattributes тримає LF, і саме на
      # Linux-раннері видно, якщо це перестало діяти.
      - run: cargo fmt --all --check
      - name: Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude trashradar-shell --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: Surface clippy output
        if: failure() && steps.clippy.conclusion == 'failure'
        run: bash ../scripts/ci-annotate.sh "Clippy output (linux)" clippy.log
      # Тести — лише `domain` і `app`: це платформно-нейтральні шари
      # (docs/repository.md §3–4), і саме там шляхова логіка мусить бути
      # правильною на будь-якій ФС. Саме тут вилізають припущення на кшталт
      # «глибина = кількість `\`» — реальний баг, знайдений цією джобою.
      #
      # `infra/*` навмисно НЕ тестується тут: це адаптери під конкретну
      # платформу (MFT, USN, WinAPI-виключення, індекс за Windows-шляхами), і
      # їхні фікстури записані у Windows-формі. Прогін їх на Linux перевіряв
      # би роздільник, а не логіку. Компіляцію й лінти всього воркспейсу
      # крок clippy вище все одно робить — саме він ловить правило 6.
      - name: Tests (platform-neutral layers)
        id: tests
        run: |
          set -o pipefail
          cargo test -p trashradar-domain -p trashradar-app 2>&1 | tee cargo-test.log
      - name: Surface cargo test output
        if: failure() && steps.tests.conclusion == 'failure'
        run: bash ../scripts/ci-annotate.sh "cargo test output (linux)" cargo-test.log

  shell:
    name: Core shell (tauri check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: shell-windows

      # Правило 2: `tauri::generate_context!` вбудовує бандл на етапі
      # компіляції, а ui/dist у .gitignore. Без цих кроків cargo падає з
      # «proc macro panicked» і кодом 101 — що виглядає як проблема Rust-коду.
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: ui

      - name: Check shell
        id: check_shell
        shell: bash
        working-directory: core
        run: |
          set -o pipefail
          cargo check -p trashradar-shell 2>&1 | tee check.log
          cargo clippy -p trashradar-shell -- -D warnings 2>&1 | tee -a check.log
      - name: Surface shell output
        if: failure() && steps.check_shell.conclusion == 'failure'
        shell: bash
        run: bash scripts/ci-annotate.sh "Shell check output" core/check.log

  e2e:
    name: E2E (crash recovery matrix)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/e2e
      # T-156: reap/purge crash-recovery matrix on real FS + SQLite.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee e2e.log
      - name: Surface e2e output
        if: failure() && steps.tests.conclusion == 'failure'
        shell: bash
        run: bash ../../scripts/ci-annotate.sh "E2E output" e2e.log

  bench:
    name: Bench (§15 regression gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            benches/index-bench
            benches/scan-bench
            benches/dup-bench
            benches/rerun-bench
            benches/reap-bench
            benches/mem-bench

      # T-019: in-memory index — memory hard-gate >15%; timings WARN + ceiling
      - name: index-bench (T-019)
        working-directory: benches/index-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-035: scan→index fill @ 1.5M synthetic — §15 ceiling 10s; memory hard-gate
      - name: scan-bench (T-035)
        working-directory: benches/scan-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-066: duplicate cascade first vs warm-cache session
      - name: dup-bench (T-066)
        working-directory: benches/dup-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-154: restart pipeline (SQLite restore + USN delta + recalc) — §15 ceiling 2s
      - name: rerun-bench (T-154)
        working-directory: benches/rerun-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-154: transactional reap of 1000 files on real FS — §15 ceiling 2s
      - name: reap-bench (T-154)
        working-directory: benches/reap-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release

      # T-157: real process RSS after scan — §15 ceiling 300MB + streaming guard
      - name: mem-bench (T-157)
        working-directory: benches/mem-bench
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --release
